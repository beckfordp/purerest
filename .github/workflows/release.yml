name: Release

# Publishes purerest to this repo's GitHub Packages Maven registry when a
# v-prefixed tag is pushed (e.g. v1.2.3). sbt-dynver derives the published
# version from the tag; publishTo/credentials live in build.sbt (see
# conductor/tech-stack.md's Publishing section).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

# Pages deployments must not overlap.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # sbt-dynver needs full tag history to derive the version.
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Test gate
        run: sbt scalafmtCheck test

      - name: Publish purerest
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sbt purerestlib/publish pureKafka/publish sbtPureKafkaDocs/publish

  deploy-docs:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Generate Scaladoc
        run: sbt purerestlib/doc

      - name: Work around missing jQuery in Scala 3.9.0's Scaladoc output (scala/scala3#22014)
        run: |
          find modules/purerestlib/target/scala-3.9.0/api -name "*.html" -exec \
            sed -i 's#<head>#<head><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>#' {} +

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: modules/purerestlib/target/scala-3.9.0/api

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
