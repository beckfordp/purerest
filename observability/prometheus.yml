global:
  scrape_interval: 5s

scrape_configs:
  - job_name: order-service
    static_configs:
      - targets: ["order-service:9090"]

  - job_name: inventory-service
    static_configs:
      - targets: ["inventory-service:9091"]

  - job_name: kafka-harness
    static_configs:
      - targets: ["kafka-harness:9093"]
