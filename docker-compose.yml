services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 2s
      timeout: 5s
      retries: 30

  # --- Everything below only starts via `docker compose --profile observability up`.
  # Plain `docker compose up` (used by scripts/verify-*.sh and everyday `sbt bgRun`
  # dev) still starts only postgres, unchanged. See conductor/tech-stack.md.

  order-service:
    image: order-service:latest
    profiles: ["observability"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      INVENTORY_SERVICE_BASE_URL: "http://inventory-service:8081"
    ports:
      - "8080:8080"
      - "9090:9090"

  inventory-service:
    image: inventory-service:latest
    profiles: ["observability"]
    environment:
      INVENTORY_INDUCED_FAILURE_RATE: "${INVENTORY_INDUCED_FAILURE_RATE:-0}"
    ports:
      - "8081:8081"
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v3.13.3
    profiles: ["observability"]
    depends_on:
      - order-service
      - inventory-service
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9092:9090"

  grafana:
    image: grafana/grafana-oss:13.0.2
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      # Local dev only — no auth hardening (see conductor/tech-stack.md's
      # observability-stack out-of-scope note).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.19
    profiles: ["observability"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.19
    profiles: ["observability"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  # One-shot: Kibana has no file-based provisioning like Grafana's, so its
  # "purerest-logs-*" Data View (index pattern) has to be created via its
  # Saved Objects API instead — without this, Discover shows nothing even
  # though Filebeat is shipping real documents into Elasticsearch. Idempotent
  # (tolerates the "already exists" 409 on a re-run) and exits after.
  kibana-setup:
    image: curlimages/curl:8.11.1
    profiles: ["observability"]
    depends_on:
      kibana:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        curl -s -X POST http://kibana:5601/api/data_views/data_view \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d '{"data_view":{"id":"purerest-logs","title":"purerest-logs-*","name":"purerest-logs","timeFieldName":"@timestamp"}}' \
          -o /dev/null -w 'data view: %{http_code}\n' || true
        curl -s -X POST http://kibana:5601/api/kibana/settings \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d '{"changes":{"defaultIndex":"purerest-logs"}}' \
          -o /dev/null -w 'default index: %{http_code}\n' || true
        curl -s -X POST http://kibana:5601/api/saved_objects/search/purerest-logs-search \
          -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d '{"attributes":{"title":"purerest logs","columns":["service.name","level","message","logger_name","trace_id","order_id","item","quantity","reservation_id"],"sort":[["@timestamp","desc"]],"kibanaSavedObjectMeta":{"searchSourceJSON":"{\"query\":{\"query\":\"\",\"language\":\"kuery\"},\"filter\":[],\"indexRefName\":\"kibanaSavedObjectMeta.searchSourceJSON.index\"}"}},"references":[{"name":"kibanaSavedObjectMeta.searchSourceJSON.index","type":"index-pattern","id":"purerest-logs"}]}' \
          -o /dev/null -w 'saved search: %{http_code}\n' || true

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.19.19
    profiles: ["observability"]
    user: root
    command: ["--strict.perms=false", "-e"]
    depends_on:
      elasticsearch:
        condition: service_healthy
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
    volumes:
      - ./observability/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

  # Single-node, KRaft-mode broker, same image/version and config shape as
  # gluon's own infra/k8s/local-infra/kafka.yaml (adapted to compose syntax)
  # — not used by order-service/inventory-service, only by kafka-harness
  # below (purekafka's Grafana-visible demo, see scripts/verify-kafka-observability.sh).
  kafka:
    image: apache/kafka:3.8.0
    profiles: ["observability"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 18

  kafka-harness:
    image: kafka-harness:latest
    profiles: ["observability"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      METRICS_PORT: "9093"
      HTTP_PORT: "8080"
    ports:
      - "9093:9093"
      # AsyncAPI docs HTTP server (ADR 0010's AsyncAPI follow-up) — see
      # scripts/generate-kafka-asyncapi-docs.sh / verify-kafka-asyncapi-docs.sh.
      - "8085:8080"
    volumes:
      # generate-kafka-asyncapi-docs.sh (run on the host) writes static
      # HTML here; kafka-harness serves it back out from the same path at
      # /docs/asyncapi — a bind mount rather than baking generated docs
      # into the image, so a regeneration doesn't need a rebuild/restart.
      - ./target/asyncapi-docs:/app/asyncapi-docs

volumes:
  postgres-data:
